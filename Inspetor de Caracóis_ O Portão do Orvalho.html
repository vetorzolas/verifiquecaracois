<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
:root{--fern:#10201a;--moss:#264434;--dew:#d3eadb;--mute:#93b3a0;--parch:#efe5c9;--ink:#241f14;--amber:#e3ad4a;--ruby:#b3362b;--leaf:#4f8f4a;--ghost:#cfeaff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--fern)}
*{box-sizing:border-box}

body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#2f5a44 0,#10201a 60%);color:var(--dew);font:17px/1.55 "Cormorant Garamond",Georgia,serif;font-weight:500}
main{max-width:920px;margin:0 auto;padding:14px}
h1{font-size:30px;margin:2px 0 0;font-weight:700;letter-spacing:.3px}
h2{font-size:22px;margin:0 0 6px;font-weight:700}
.bar{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);margin:4px 0 12px}
.bar b{color:var(--dew)}
.grid{display:flex;gap:14px;flex-wrap:wrap}
.paper{background:var(--parch);color:var(--ink);border-radius:6px;padding:14px 16px;box-shadow:0 8px 22px #0007,inset 0 0 0 1px #0002}
.rules{flex:1 1 250px;align-self:flex-start}
.rules ol{margin:0;padding-left:26px}
.rules li{margin:0 0 7px}
.imm{margin-top:10px;padding:10px;border-radius:5px;background:#1a2733;color:var(--ghost);box-shadow:0 0 14px #9fd8ff55}
.desk{flex:2 1 360px;display:flex;flex-direction:column;gap:12px}
svg{width:100%;height:auto;border-radius:10px;box-shadow:0 10px 28px #000a;display:block}
.doc{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:0 14px;margin:0}@media (max-width:540px){.doc{grid-template-columns:auto 1fr}}.tb{width:100%;border-collapse:collapse;font-size:15px}.tb td{padding:3px 4px;border-top:1px solid #0002;vertical-align:middle}.tb i{display:block;width:16px;height:12px;border-radius:50%;border:2px solid}
.doc dt{color:#6b6244}.doc dd{margin:0;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{flex:1 1 120px;font:inherit;font-weight:700;font-size:19px;padding:11px 8px;border-radius:6px;border:0;cursor:pointer;color:#0e1a12;box-shadow:0 4px 0 #0006}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0006}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#ok{background:#8fcf7f}#no{background:#e07a6c}#salt{background:var(--amber)}
.go{background:var(--dew);max-width:280px;margin-top:14px}
.fb{min-height:54px;font-size:19px}
.fb.good{color:#9be28b}.fb.bad{color:#f19a8d}
.card{max-width:560px;margin:30px auto;text-align:center}
.lore{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:10px}
.lore p{max-width:520px;margin:0;font-size:23px;opacity:0;animation:in 1.6s forwards}
.lore .imm-t{color:var(--ghost);text-shadow:0 0 14px #9fd8ff}
.lore .go{opacity:0;animation:in 1.4s forwards}
.skip{background:none;box-shadow:none;color:var(--mute);font-size:16px;flex:none;text-decoration:underline}
@keyframes in{to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
.pulse{animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){.lore p,.lore .go{animation-duration:.01s}.pulse{animation:none}}
</style>
</head>
<body>
<main>
<h1>Inspetor de Caracóis</h1>
<div class="bar" id="bar"></div>
<div id="app"></div>
</main>
<script>
const SP={"Jardim":{c:["#f0b45a","#a85f1c"],b:["#f1dfb0","#b79b5c"],p:"listras",r:"Horta"},"Verde":{c:["#a9d174","#4f7a2e"],b:["#c8e0a0","#7a9b55"],p:"pintas",r:"Mata"},"Barro":{c:["#b57d55","#5a3520"],b:["#b9a58f","#7a6650"],p:"liso",r:"Brejo"},"Pérola":{c:["#f3eefb","#9d93bd"],b:["#f6e6ec","#c9a7b8"],p:"ondas",r:"Gruta"},"Rubi":{c:["#ee7b6c","#8f2a26"],b:["#e9b3a6","#a8574b"],p:"zigue",r:"Cinzas"},"Lunar":{c:["#8fb2ee","#33508f"],b:["#c3d3ef","#6f86b5"],p:"argolas",r:"Serra"},"Ouro":{c:["#f6d86a","#a8801a"],b:["#f7e9b0","#c2a550"],p:"raios",r:"Deserto"},"Aurora":{c:["#f2a1c8","#a13f78"],b:["#f7d4e3","#c98aa9"],p:"estrelas",r:"Ilha"},"Musgo":{c:["#5f8f5a","#254a2c"],b:["#a7bf8e","#5c7a4c"],p:"manchas",r:"Ruínas"},"Obsidiana":{c:["#6a5a8c","#1d1633"],b:["#8f83a8","#4a3f63"],p:"veios",r:"Abismo"}};
const FM={Jardim:0,Verde:1,Barro:2,"Pérola":0,Rubi:1,Lunar:2,Ouro:1,Aurora:2,Musgo:0,Obsidiana:1};
const NAMES=Object.keys(SP);
const NOMES=["Baba","Gaspar","Conchita","Orvalho","Pitanga","Lúcia","Nhoque","Tobias","Mel","Dona Gosma","Brisa","Zeca","Lesmo","Dendê","Maruja","Cacau","Ferrugem"];
const RULES=[
 {t:"O número marcado ao lado do caracol deve ser igual ao número da licença do documento.",s:"número do caracol diferente da licença",ok:s=>(s.num||s.nl)===s.nl},
 {t:"Deve ter exatamente 2 antenas.",s:"antenas erradas",ok:s=>s.ant===2},
 {t:"A espiral da concha gira para a direita.",s:"espiral invertida",ok:s=>s.dir===1},
 {t:"A cor da concha deve combinar com a espécie do documento.",s:"cor não combina com a espécie",ok:s=>s.col===s.sp},
 {t:"A licença deve estar na validade (hoje: 10/26).",s:"licença vencida",ok:s=>s.val},
 {t:"Deve deixar um rastro de muco brilhante.",s:"sem rastro de muco",ok:s=>s.trail},
 {t:"Cada marca no lábio da concha é 1 ano de vida e deve bater com a idade do documento.",s:"idade não bate com as marcas",ok:s=>s.rings===s.age},
 {t:"O padrão da concha deve combinar com a espécie (veja a Tabela de Espécies).",s:"padrão da concha errado",ok:s=>s.pat===s.sp},
 {t:"A cor do corpo deve combinar com a espécie.",s:"cor do corpo errada",ok:s=>s.corpo===s.sp},
 {t:"A procedência do documento deve ser a da espécie (veja a Tabela de Espécies).",s:"procedência não combina",ok:s=>s.reg===SP[s.sp].r},
 {t:"O peso do documento deve combinar com o tamanho da concha (pequena até 9 g, média de 10 a 20 g, grande acima de 20 g).",s:"peso não combina com o tamanho",ok:s=>s.peso<10?s.tam===0:s.peso<=20?s.tam===1:s.tam===2},
 {t:"O nome na etiqueta da concha deve ser igual ao nome do documento.",s:"etiqueta com outro nome",ok:s=>s.tag===s.nome},
 {t:"O muco deve ser claro (muco amarelo indica doença).",s:"muco amarelado",ok:s=>!s.trail||!s.mu},
 {t:"A espiral da concha deve ter 3 ou 4 voltas completas.",s:"número de voltas errado",ok:s=>s.vol===3||s.vol===4},
 {t:"A concha não pode ter rachaduras escuras (rachaduras que brilham são sinal de Imortal).",s:"rachadura na concha",ok:s=>!s.rach},
 {t:"O carimbo da alfândega no documento deve ser verde (azul ou vermelho indica falsificação).",s:"carimbo falso",ok:s=>s.car==="verde"},
 {t:"O número da licença deve ter exatamente 5 dígitos.",s:"número da licença com tamanho errado",ok:s=>s.nl.length===5},
 {t:"O ano de nascimento deve bater com a idade (hoje é 2026).",s:"ano de nascimento não bate",ok:s=>s.nasc+s.age===2026},
 {t:"O Portão só atende entre 05:00 e 18:00; chegada fora desse horário é suspeita.",s:"chegou fora do horário",ok:s=>s.hh>=5&&s.hh<18},
 {t:"As antenas devem ter o mesmo comprimento (uma curta indica mutilação).",s:"antena mutilada",ok:s=>!s.curta},
 {t:"O formato da concha deve combinar com a espécie (veja a Tabela de Espécies).",s:"formato da concha errado",ok:s=>s.forma===FM[s.sp]},
 {t:"A temperatura corporal deve estar entre 12 °C e 24 °C.",s:"temperatura fora da faixa",ok:s=>s.temp>=12&&s.temp<=24},
 {t:"A bagagem pode ter no máximo 2 itens.",s:"bagagem demais",ok:s=>s.bag<=2},
 {t:"A hemolinfa deve ser azulada (vermelha ou escura indica doença).",s:"hemolinfa alterada",ok:s=>s.hem==="azulada"},
 {t:"A vacina contra o Mofo deve estar em dia.",s:"vacina atrasada",ok:s=>s.vac==="sim"},
 {t:"A ocupação não pode ser Oficial Imperial (o Imperador não viaja sozinho).",s:"ocupação proibida",ok:s=>s.oc!=="Oficial Imperial"},
 {t:"A etiqueta da concha deve ser creme (rosa ou cinza indica documento de outro posto).",s:"etiqueta de outra cor",ok:s=>s.etq==="creme"}
];
const PER=8,TURNOS=6,MAXF=3,AT=[8,11,15,19,23,27];
const TITULOS=["Madrugada no Portão","A Primeira Névoa","Hora do Sal","Chuva Fina","Maré de Viajantes","O Último Turno"];
let G;const $=id=>document.getElementById(id);const pick=a=>a[Math.floor(Math.random()*a.length)];
const A=()=>AT[G.shift-1],P=()=>G.shift>1?AT[G.shift-2]:0;
function make(a,immOk){
 const sp=pick(NAMES),age=3+Math.floor(Math.random()*7);
 const tam=pick([0,1,2]),W=[[4,9],[11,19],[21,34]],wr=t=>W[t][0]+Math.floor(Math.random()*(W[t][1]-W[t][0]+1)),oth=()=>pick(NAMES.filter(n=>n!==sp));
 const s={nome:pick(NOMES),sp,col:sp,ant:2,dir:1,val:true,trail:true,age,rings:age,imm:0,eyes:0,crack:0,pat:sp,corpo:sp,reg:SP[sp].r,tam,peso:wr(tam),mu:0,vol:pick([3,4]),rach:0,car:"verde",nl:String(10000+Math.floor(Math.random()*90000)),nasc:2026-age,hh:5+Math.floor(Math.random()*13),mm:Math.floor(Math.random()*60),curta:0,forma:FM[sp],temp:12+Math.floor(Math.random()*13),bag:Math.floor(Math.random()*3),hem:"azulada",vac:"sim",oc:pick(["Mensageiro","Cozinheiro","Jardineiro","Tecelão","Barqueiro","Vigia"]),etq:"creme",num:null};s.tag=s.nome;
 if(immOk&&Math.random()<.17){s.imm=1;const r=Math.random();if(r<.4){s.eyes=1;s.crack=1}else if(r<.7)s.eyes=1;else s.crack=1}
 else{
  const br=[()=>{const k=Math.floor(Math.random()*s.nl.length);s.num=s.nl.slice(0,k)+((+s.nl[k]+1+Math.floor(Math.random()*9))%10)+s.nl.slice(k+1)},()=>s.ant=pick([1,3]),()=>s.dir=-1,()=>s.col=pick(NAMES.filter(n=>n!==sp)),()=>s.val=false,()=>s.trail=false,()=>s.rings=age+pick([-2,-1,1,2]),()=>s.pat=oth(),()=>s.corpo=oth(),()=>s.reg=SP[oth()].r,()=>{s.peso=wr(pick([0,1,2].filter(t=>t!==tam)))},()=>s.tag=pick(NOMES.filter(n=>n!==s.nome)),()=>s.mu=1,()=>s.vol=pick([2,6]),()=>s.rach=1,()=>s.car=pick(["azul","vermelho"]),()=>s.nl=String(Math.random()<.5?1000+Math.floor(Math.random()*9000):100000+Math.floor(Math.random()*900000)),()=>s.nasc=2026-age+pick([-3,-2,-1,1,2]),()=>s.hh=pick([0,1,2,3,19,20,21,22,23]),()=>s.curta=1,()=>s.forma=(FM[sp]+1+Math.floor(Math.random()*2))%3,()=>s.temp=pick([4,6,8,29,31,34]),()=>s.bag=pick([3,4,5]),()=>s.hem=pick(["vermelha","escura"]),()=>s.vac="não",()=>s.oc="Oficial Imperial",()=>s.etq=pick(["rosa","cinza"])];
  const w=Math.random()<.55?Math.floor(Math.random()*a):-1;
  for(let i=0;i<27;i++){if(i<a){if(i===w)br[i]()}else if(Math.random()<.07)br[i]()}
 }
 s.m=s.val?pick(["11/26","12/26","02/27","05/27","08/27"]):pick(["03/26","06/26","08/26","09/26"]);
 return s;
}
const broken=s=>RULES.slice(0,A()).map((r,i)=>r.ok(s)?-1:i).filter(i=>i>=0);
function eye(x,y,w){return w?`<circle cx="${x}" cy="${y}" r="7" fill="#f4fbff" filter="url(#g)"/>`:`<circle cx="${x}" cy="${y}" r="6" fill="#1d2916"/><circle cx="${x-2}" cy="${y-2}" r="2" fill="#fff"/>`}
function spiral(d,v){let p="";for(let i=0;i<=80;i++){const a=i*v*Math.PI/40,r=1+i*.7;p+=(i?"L":"M")+(108+d*r*Math.cos(a)).toFixed(1)+" "+(100+r*Math.sin(a)).toFixed(1)}return p}
function pat(p,c){let o="";
 if(p==="listras")for(let i=0;i<7;i++)o+=`<path d="M${48+i*20} 38L${28+i*20} 164" stroke="${c}" stroke-width="5" opacity=".5"/>`;
 else if(p==="pintas")[[80,70],[120,64],[150,96],[92,110],[130,130],[70,128],[108,90],[152,126],[100,148]].forEach(([x,y])=>o+=`<circle cx="${x}" cy="${y}" r="5" fill="${c}" opacity=".6"/>`);
 else if(p==="ondas")for(let i=0;i<5;i++)o+=`<path d="M46 ${60+i*20}q15 -10 30 0t30 0t30 0t30 0" fill="none" stroke="${c}" stroke-width="3" opacity=".55"/>`;
 else if(p==="zigue")for(let i=0;i<3;i++)o+=`<path d="M46 ${70+i*28}l12 -12l12 12l12 -12l12 12l12 -12l12 12l12 -12l12 12" fill="none" stroke="${c}" stroke-width="3.5" opacity=".6"/>`;
 else if(p==="argolas")[[78,74],[124,66],[96,104],[140,104],[110,138],[72,122]].forEach(([x,y])=>o+=`<circle cx="${x}" cy="${y}" r="8" fill="none" stroke="#fff" stroke-width="2.5" opacity=".6"/>`);
 if(p==="raios")for(let i=0;i<8;i++)o+=`<path d="M108 100L${(108+75*Math.cos(i*Math.PI/4)).toFixed(0)} ${(100+75*Math.sin(i*Math.PI/4)).toFixed(0)}" stroke="${c}" stroke-width="4" opacity=".5"/>`;
 if(p==="estrelas")[[78,72],[126,64],[100,106],[142,108],[112,140],[72,124]].forEach(([x,y])=>o+=`<path d="M${x} ${y-7}L${x+2} ${y-2}L${x+7} ${y}L${x+2} ${y+2}L${x} ${y+7}L${x-2} ${y+2}L${x-7} ${y}L${x-2} ${y-2}Z" fill="#fff" opacity=".75"/>`);
 if(p==="manchas")[[84,72,13,9],[130,88,15,11],[98,126,14,10],[148,130,10,8]].forEach(([x,y,a,b])=>o+=`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${c}" opacity=".55"/>`);
 if(p==="veios")for(let i=0;i<8;i++)o+=`<path d="M${40+i*16} 40L${i*16+10} 170M${40+i*16} 170L${i*16+110} 40" stroke="#fff" stroke-width="1.5" opacity=".28"/>`;
 return `<g clip-path="url(#cp)">${o}</g>`}
function svg(s){
 const [c1,c2]=SP[s.col].c,[b1,b2]=SP[s.corpo].b,xs={1:[212],2:[200,226],3:[192,212,232]}[s.ant];
 let a="",t="";
 xs.forEach((x,i)=>{const y=s.curta&&!i?66:46;a+=`<path d="M216 94Q${(216+x)/2-8} ${y+18} ${x} ${y}" fill="none" stroke="#8d9a63" stroke-width="4.5" stroke-linecap="round"/>`+eye(x,y-2,s.eyes)});
 for(let i=0;i<s.rings;i++){const g=(-172+i*11)*Math.PI/180;t+=`<line x1="${(108+51*Math.cos(g)).toFixed(1)}" y1="${(100+51*Math.sin(g)).toFixed(1)}" x2="${(108+60*Math.cos(g)).toFixed(1)}" y2="${(100+60*Math.sin(g)).toFixed(1)}" stroke="#fff6d8" stroke-width="3" stroke-linecap="round"/>`}
 const trail=s.trail?`<path d="M0 163Q70 154 130 160T240 158" fill="none" stroke="${s.mu?"#d6cf5a":"#cdeedd"}" stroke-width="8" stroke-linecap="round" opacity=".6"/><path d="M0 162Q70 153 130 159T240 157" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/><circle cx="40" cy="157" r="2" fill="#fff"/><circle cx="96" cy="157" r="1.6" fill="#fff"/><circle cx="170" cy="159" r="2" fill="#fff"/>`:`<path d="M0 163Q70 154 130 160T240 158" fill="none" stroke="#3b4a31" stroke-width="3" stroke-dasharray="3 9" opacity=".7"/>`;
 return `<svg viewBox="0 0 300 210" role="img" aria-label="${s.nome}: caracol de concha ${s.col}, ${s.ant} antenas, espiral para a ${s.dir===1?"direita":"esquerda"}, ${s.rings} marcas${s.eyes?", olhos brancos":""}${s.crack?", rachadura luminosa":""}${s.trail?"":", sem rastro"}">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16342a"/><stop offset="1" stop-color="#3b6a4c"/></linearGradient>
<radialGradient id="sh" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b1}"/><stop offset="1" stop-color="${b2}"/></linearGradient>
<clipPath id="cp"><circle cx="108" cy="100" r="59"/></clipPath><filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="300" height="210" fill="url(#bg)"/>
<circle cx="250" cy="34" r="22" fill="#e9f3d6" opacity=".18"/><circle cx="250" cy="34" r="12" fill="#e9f3d6" opacity=".25"/>
<path d="M0 0Q50 20 38 78Q10 60 0 70Z" fill="#0d2219"/><path d="M300 0Q250 30 266 90Q292 70 300 84Z" fill="#0d2219"/>
<rect y="160" width="300" height="50" fill="#1c3a28"/><path d="M0 172Q80 164 150 176T300 170V210H0Z" fill="#14291d"/>
<g fill="#cfeadb" opacity=".6"><circle cx="30" cy="190" r="2"/><circle cx="270" cy="196" r="2.4"/><circle cx="150" cy="198" r="1.8"/></g>
${trail}
<ellipse cx="125" cy="162" rx="105" ry="8" fill="#0006"/>
<path d="M20 160Q14 138 46 136L176 136Q194 106 214 92Q230 86 230 102Q226 124 236 144Q242 160 220 162Z" fill="url(#bd)" stroke="#6d6740" stroke-width="2"/>
<g transform="translate(108 100) scale(${[.82,1,1.12][s.tam]*[1,.9,1.1][s.forma]} ${[.82,1,1.12][s.tam]*[1,1.1,.9][s.forma]}) translate(-108 -100)"><circle cx="108" cy="100" r="60" fill="url(#sh)" stroke="${c2}" stroke-width="3"/>${pat(SP[s.pat].p,c2)}
<path d="${spiral(s.dir,s.vol)}" fill="none" stroke="${c2}" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
<path d="M66 70Q82 46 112 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".4"/>
${t}${s.crack?`<path class="pulse" d="M142 52L130 74L146 88L132 106L148 124L138 140" fill="none" stroke="#d8f1ff" stroke-width="3.5" stroke-linejoin="round" filter="url(#g)"/>`:""}
${s.rach?`<path d="M96 48L88 70L104 84L92 102L100 118" fill="none" stroke="#2a1a10" stroke-width="3" stroke-linejoin="round"/>`:""}</g><g transform="rotate(-6 70 162)"><path d="M70 140V156" stroke="#6d6740" stroke-width="1.5"/><rect x="36" y="154" width="68" height="19" rx="3" fill="${{creme:"#efe5c9",rosa:"#f3b6cc",cinza:"#b8b8b0"}[s.etq]}" stroke="#6d6740"/><text x="70" y="167" font-size="11" text-anchor="middle" fill="#241f14" font-family="Georgia,serif">${s.tag}</text></g>${a}<g><rect x="10" y="12" width="88" height="30" rx="4" fill="#efe5c9" stroke="#6d6740" stroke-width="2"/><text x="54" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#241f14" font-family="Georgia,serif">Nº ${s.num||s.nl}</text></g></svg>`;
}
function tabela(){return `<h2 style="margin-top:16px">Tabela de Espécies</h2><table class="tb">${NAMES.map(n=>{const e=SP[n];return `<tr><td><i style="background:${e.c[0]};border-color:${e.c[1]}"></i><i style="background:${e.b[0]};border-color:${e.b[1]};border-radius:3px;margin-top:2px"></i></td><td><b>${n}</b></td><td>${e.p==="zigue"?"zigue-zague":e.p}, ${["redonda","alta","achatada"][FM[n]]}</td><td>${e.r}</td></tr>`}).join("")}</table>`}
function bar(){$("bar").innerHTML=`<span>Turno <b>${G.shift}</b>/${TURNOS}</span><span>Caracol <b>${Math.min(G.i+1,PER)}</b>/${PER}</span><span>Acertos <b>${G.score}</b></span><span>Falhas <b>${G.f}</b>/${MAXF}</span>`}
function rulesHtml(n){return `<ol>${RULES.slice(0,A()).map((r,i)=>`<li${n&&G.shift>1&&i>=P()?' style="font-weight:700"':""}>${r.t}</li>`).join("")}</ol>`+(G.shift>=2?`<div class="imm"><b>Imortais:</b> olhos brancos como leite ou rachadura luminosa na concha. Nunca aprove e nunca toque. Chame o sal.</div>`:"")}
function lore(){
 $("bar").innerHTML="";
 const L=["Há muito tempo a chuva não parou, e o mundo ficou lento.","Os caracóis herdaram a Terra. Ergueram cidades de conchas, estradas de baba e um Império que nunca tem pressa.","Mas, na quarta geração do Muco, alguns nasceram sem fim.",'<span class="imm-t">Os Imortais. Olhos de leite, conchas rachadas de luz. Quem os toca, mesmo de leve, vira pó.</span>',"Para proteger o Império, o Portão do Orvalho exige a verificação de cada viajante.","Você é o novo Inspetor. Olhe, confira, nunca toque.","E reze para o sal nunca acabar."];
 const D=[.5,4,8.5,13,18,22,26];
 $("app").innerHTML=`<div class="lore">${L.map((t,i)=>`<p style="animation-delay:${D[i]}s">${t}</p>`).join("")}<button class="go" id="go" style="animation-delay:29s">Assumir o posto</button><button class="skip" id="sk">Pular</button></div>`;
 $("go").onclick=$("sk").onclick=intro;
}
function intro(){
 bar();
 const t=G.shift===2?"Hoje chegam os primeiros suspeitos de imortalidade. Se achar um, não aprove: chame o guarda de sal. Salgar um cidadão inocente também conta como falha.":G.shift===1?"Confira cada viajante com o manual e decida. Três falhas e você é dispensado.":"O manual ganhou regras novas (em negrito).";
 $("app").innerHTML=`<div class="paper card"><h2>Turno ${G.shift}: ${TITULOS[G.shift-1]}</h2><p>${t}</p>${rulesHtml(1)}<button class="go" id="go">Abrir a banca</button></div>`;
 $("go").onclick=show;
}
function show(){
 bar();G.cur=make(A(),G.shift>=2);const s=G.cur;
 $("app").innerHTML=`<div class="grid"><aside class="paper rules"><h2>Manual do Inspetor</h2>${rulesHtml()}${tabela()}</aside>
<section class="desk">${svg(s)}<div class="paper"><dl class="doc"><dt>Nome</dt><dd>${s.nome}</dd><dt>Espécie</dt><dd>${s.sp}</dd><dt>Idade</dt><dd>${s.age} anos</dd><dt>Peso</dt><dd>${s.peso} g</dd><dt>Procedência</dt><dd>${s.reg}</dd><dt>Licença</dt><dd>válida até ${s.m}</dd><dt>Nº licença</dt><dd>${s.nl}</dd><dt>Nascimento</dt><dd>${s.nasc}</dd><dt>Chegada</dt><dd>${String(s.hh).padStart(2,"0")}:${String(s.mm).padStart(2,"0")}</dd><dt>Carimbo</dt><dd style="color:${{verde:"#2e7d32",azul:"#1f5fbf",vermelho:"#b3362b"}[s.car]}">${s.car}</dd><dt>Temperatura</dt><dd>${s.temp} °C</dd><dt>Bagagem</dt><dd>${s.bag} ${s.bag===1?"item":"itens"}</dd><dt>Hemolinfa</dt><dd>${s.hem}</dd><dt>Vacina Mofo</dt><dd>${s.vac}</dd><dt>Ocupação</dt><dd>${s.oc}</dd></dl></div>
<div class="btns"><button id="ok">Aprovar</button><button id="no">Reprovar</button>${G.shift>=2?'<button id="salt">Chamar o sal</button>':""}</div>
<div class="fb" id="fb" aria-live="polite"></div><button class="go" id="next" hidden>Próximo</button></section></div>`;
 $("ok").onclick=()=>decide("ok");$("no").onclick=()=>decide("no");if($("salt"))$("salt").onclick=()=>decide("salt");
}
function decide(act){
 const s=G.cur,b=broken(s),why=b.map(i=>RULES[i].s).join(", ");let right=0,msg;
 if(s.imm){
  if(act==="ok")return end("dead");
  if(act==="salt"){right=1;msg="Salgado a tempo. O Imortal virou espuma e a fila respirou aliviada."}
  else msg="Você o recusou sem sal, e ele escapou e tocou um viajante."
 }else if(act==="salt")msg="O guarda dissolveu um cidadão inocente. Não era Imortal.";
 else if(act==="ok"){right=!b.length;msg=right?"Tudo em ordem com o manual.":"Aprovado com defeito: "+why+"."}
 else{right=b.length>0;msg=right?"Reprovado corretamente: "+why+".":"Era um viajante válido, barrado à toa."}
 ["ok","no","salt"].forEach(i=>{if($(i))$(i).disabled=true});
 right?G.score++:G.f++;bar();
 const f=$("fb");f.className="fb "+(right?"good":"bad");f.textContent=(right?"Certo. ":"Falha. ")+msg;
 const n=$("next");n.hidden=false;n.focus();n.textContent=G.f>=MAXF?"Ver resultado":"Próximo";
 n.onclick=()=>{
  if(G.f>=MAXF)return end("fired");
  if(++G.i>=PER){if(G.shift===TURNOS)return end("win");G.shift++;G.i=0;return intro()}
  show();
 };
}
function end(k){
 bar();
 const T={win:["O Portão está a salvo","Você sobreviveu aos "+TURNOS+" turnos. O Império dorme em paz, devagar como sempre."],fired:["Você foi dispensado","Três falhas no mesmo plantão. O Império encontrou outro inspetor."],dead:["Um toque frio","Você aprovou um Imortal. Sentiu a mão gelada na concha do viajante e, depois, nada além de pó."]}[k];
 $("app").innerHTML=`<div class="paper card"><h2>${T[0]}</h2><p>${T[1]}</p><p><b>Acertos: ${G.score}</b></p><button class="go" id="again">Jogar de novo</button></div>`;
 $("again").onclick=start;
}
function start(){G={shift:1,i:0,score:0,f:0};intro()}
G={shift:1,i:0,score:0,f:0};lore();
</script>
</body>
</html>
